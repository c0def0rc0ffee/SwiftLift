<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baumans&family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SwiftLift - Guernsey Lift Sharing</title>
    <meta name="description" content="A community noticeboard for sharing regular journeys around Guernsey. Match with people on your route, message them in-app, share a lift." />

    <!-- Open Graph / link previews, for Facebook, WhatsApp, iMessage, Slack
         et al. Image is the existing 512px PWA icon. -->
    <meta property="og:type"         content="website" />
    <meta property="og:site_name"    content="SwiftLift" />
    <meta property="og:title"        content="SwiftLift - Guernsey Lift Sharing" />
    <meta property="og:description"  content="A community noticeboard for sharing regular journeys around Guernsey." />
    <meta property="og:url"          content="https://swiftlift.gg/" />
    <meta property="og:image"        content="https://swiftlift.gg/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type"   content="image/png" />
    <meta property="og:image:alt"    content="SwiftLift: free community lift sharing around Guernsey. Match on your route, message in-app, share the drive." />
    <meta property="og:locale"       content="en_GB" />

    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="SwiftLift - Guernsey Lift Sharing" />
    <meta name="twitter:description" content="A community noticeboard for sharing regular journeys around Guernsey." />
    <meta name="twitter:image"       content="https://swiftlift.gg/og-image.png" />
    <meta name="twitter:image:alt"   content="SwiftLift: free community lift sharing around Guernsey. Match on your route, message in-app, share the drive." />

    <link rel="canonical" href="https://swiftlift.gg/" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        { "@type": "WebSite", "@id": "https://swiftlift.gg/#website",
          "url": "https://swiftlift.gg/", "name": "SwiftLift",
          "description": "Free community noticeboard for sharing regular journeys around Guernsey.",
          "inLanguage": "en-GB" },
        { "@type": "Organization", "@id": "https://swiftlift.gg/#org",
          "name": "SwiftLift", "url": "https://swiftlift.gg/",
          "logo": "https://swiftlift.gg/icon-512.png",
          "areaServed": { "@type": "Place", "name": "Bailiwick of Guernsey" },
          "email": "hello@swiftlift.gg" },
        { "@type": "WebApplication", "name": "SwiftLift",
          "url": "https://swiftlift.gg/", "applicationCategory": "TravelApplication",
          "operatingSystem": "Any",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" } }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <h1>SwiftLift</h1>
        <p>SwiftLift is a free community noticeboard for sharing regular journeys around Guernsey. The app needs JavaScript to run. Enable JavaScript and reload, or read more on the <a href="/landing.html">landing page</a>.</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
